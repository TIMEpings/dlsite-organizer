[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dlsite-organizer"
version = "0.6.0"
description = "A desktop tool for looking up and organizing DLsite works"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "dlsite-organizer contributors" }]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "PySide6-Essentials>=6.8,<7",
  "selectolax>=0.3.27,<1",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.gui-scripts]
dlsite-organizer = "dlsite_organizer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dlsite_organizer"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not integration'"
testpaths = ["tests"]
markers = ["integration: tests requiring live network access (deselected by default)"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"] # Chinese user-facing strings intentionally use CJK punctuation.

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
